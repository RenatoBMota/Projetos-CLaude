<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SCV — Criar Nova Senha</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a4e8f,#1a2e4a);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:44px 40px;width:100%;max-width:420px}
    .icon{font-size:40px;margin-bottom:16px;text-align:center}
    h2{font-size:22px;font-weight:700;color:#1a4e8f;text-align:center;margin-bottom:6px}
    p.sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:24px}
    label{display:block;font-size:13px;color:#374151;font-weight:600;margin-bottom:6px}
    input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:18px;transition:border .2s}
    input:focus{outline:none;border-color:#1a4e8f;box-shadow:0 0 0 3px rgba(26,78,143,.12)}
    .btn{width:100%;padding:12px;background:#1a4e8f;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
    .btn:hover{background:#153f75}
    .error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
    .hint{background:#f0f4f9;border-radius:8px;padding:10px 14px;font-size:12px;color:#6b7280;margin-bottom:18px}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h2>Crie sua nova senha</h2>
    <p class="sub">Por segurança, defina uma senha personalizada antes de continuar.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <div class="hint">A senha deve ter no mínimo 6 caracteres.</div>

    <form method="POST">
      <label>Nova senha</label>
      <input type="password" name="nova_senha" placeholder="••••••••" required autofocus minlength="6">
      <label>Confirmar nova senha</label>
      <input type="password" name="confirmar_senha" placeholder="••••••••" required minlength="6">
      <button type="submit" class="btn">Salvar Senha e Entrar</button>
    </form>
  </div>
</body>
</html>
