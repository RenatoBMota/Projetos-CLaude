<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SCV — R&J Logistics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#1a4e8f;--pd:#153f75;--pl:#dce8f5;--acc:#e8a020;--al:#fdf3e0;
  --ok:#16a34a;--okl:#dcfce7;--dn:#dc2626;--dl:#fef2f2;--wn:#d97706;--wl:#fef3c7;
  --info:#0284c7;--infol:#e0f2fe;--bg:#f0f4f9;--card:#fff;--sb:#1a2e4a;
  --txt:#111827;--muted:#6b7280;--brd:#e5e7eb;--r:10px;--sw:240px}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;overflow:hidden}

/* SIDEBAR */
#sb{width:var(--sw);background:var(--sb);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow-y:auto}
.sb-head{padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sb-logo img,.sb-logo .sb-icon{height:38px;width:38px;border-radius:8px;object-fit:contain;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sb-txt .sys{font-size:13px;font-weight:700;color:#fff;line-height:1.3}
.sb-txt .co{font-size:11px;color:var(--acc);font-weight:600;margin-top:3px;text-transform:uppercase}
.uchip{background:rgba(255,255,255,.06);border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:8px}
.uav{width:26px;height:26px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.uinfo .un{font-size:12px;font-weight:600;color:#fff}
.uinfo .ur{font-size:10px;color:rgba(255,255,255,.4);text-transform:capitalize}
nav{padding:8px;flex:1}
.ns{font-size:10px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:1px;padding:10px 8px 4px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;transition:background .15s,color .15s;position:relative;user-select:none;margin-bottom:1px}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.active{background:var(--primary);color:#fff}
.ni .ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.nbadge{background:var(--dn);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:auto}
.sb-foot{padding:10px 8px;border-top:1px solid rgba(255,255,255,.08)}
.btnout{width:100%;padding:8px;background:rgba(255,255,255,.05);border:none;border-radius:8px;color:rgba(255,255,255,.5);font-size:13px;cursor:pointer;transition:background .15s}
.btnout:hover{background:rgba(220,38,38,.2);color:#fca5a5}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100vh}
#topbar{background:#fff;border-bottom:1px solid var(--brd);padding:0 22px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#topbar .pt{font-size:16px;font-weight:700;color:var(--primary)}
#content{flex:1;overflow-y:auto;padding:22px}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--brd);padding:18px;margin-bottom:18px}
.ct{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--brd)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:var(--r);border:1px solid var(--brd);padding:16px;border-left:4px solid var(--primary)}
.kpi.dn{border-left-color:var(--dn)}.kpi.wn{border-left-color:var(--wn)}.kpi.ok{border-left-color:var(--ok)}.kpi.ac{border-left-color:var(--acc)}
.kv{font-size:30px;font-weight:800;line-height:1}.kl{font-size:11px;color:var(--muted);margin-top:3px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:background .15s,transform .1s;text-decoration:none}
.btn:active{transform:scale(.97)}
.bp{background:var(--primary);color:#fff}.bp:hover{background:var(--pd)}
.ba{background:var(--acc);color:#fff}.ba:hover{background:#c8880e}
.bs{background:var(--ok);color:#fff}.bs:hover{background:#15803d}
.bd{background:var(--dn);color:#fff}.bd:hover{background:#b91c1c}
.bo{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}.bo:hover{background:var(--pl)}
.bg{background:transparent;color:var(--muted);border:1.5px solid var(--brd)}.bg:hover{background:var(--bg)}
.bsm{padding:4px 9px;font-size:12px;border-radius:6px}

/* TABLES */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--primary);color:#fff;padding:9px 11px;text-align:left;font-weight:600;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--brd);transition:background .1s}
tbody tr:hover{background:#f8fafc}
tbody td{padding:9px 11px;vertical-align:middle}

/* FORMS */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
.fc{width:100%;padding:8px 11px;border:1.5px solid #d1d5db;border-radius:7px;font-size:13px;color:var(--txt);transition:border .2s}
.fc:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,78,143,.1)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.fbar{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;background:#fff;border:1px solid var(--brd);border-radius:var(--r);padding:12px;margin-bottom:16px}
.fbar .fg{min-width:130px;flex:1;margin-bottom:0}
.fbar .fg label{font-size:11px}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bc{background:var(--dl);color:var(--dn)}.bw{background:var(--wl);color:var(--wn)}.bok{background:var(--okl);color:var(--ok)}
.bse{background:#f3f4f6;color:#374151}.badm{background:#ede9fe;color:#7c3aed}
.baud{background:var(--infol);color:var(--info)}.bvw{background:#f0fdf4;color:var(--ok)}

/* MODAL */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.mo.open{display:flex}
.mb{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.mt{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:18px}
.mf{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--brd)}

/* TOAST */
#toast{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.ti{padding:11px 18px;border-radius:9px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:si .3s ease;min-width:210px}
.ti.success{background:var(--ok)}.ti.error{background:var(--dn)}.ti.warn{background:var(--wn)}.ti.info{background:var(--info)}
@keyframes si{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* DROP ZONE */
.dz{border:2px dashed var(--brd);border-radius:var(--r);padding:32px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s;margin:10px 0}
.dz:hover,.dz.dov{background:var(--pl);border-color:var(--primary)}
.dz .dzi{font-size:2.2rem;margin-bottom:6px}.dz p{font-size:13px;color:var(--muted)}
.ll{color:var(--primary);cursor:pointer;text-decoration:underline;font-weight:600}
.fs{background:var(--okl);border-radius:7px;padding:7px 12px;font-size:13px;color:#14532d;margin-bottom:10px;display:none}

/* INFO BOXES */
.ib{border-radius:8px;padding:11px 14px;font-size:13px;margin-bottom:14px}
.ib.blue{background:var(--pl);border-left:4px solid var(--primary);color:#1e3a5f}
.ib.yel{background:var(--al);border-left:4px solid var(--acc);color:#7c4a00}
.ib.red{background:var(--dl);border-left:4px solid var(--dn);color:#7f1d1d}
.ib.grn{background:var(--okl);border-left:4px solid var(--ok);color:#14532d}

/* CHART */
.cbw{display:flex;gap:5px;align-items:flex-end;height:110px;padding:0 4px}
.bc2{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px}
.bc2 .bv{font-size:10px;color:var(--muted)}.bc2 .br{width:100%;border-radius:4px 4px 0 0;min-height:3px;background:var(--primary)}
.bc2 .bl{font-size:9px;color:var(--muted);white-space:nowrap}

/* MISC */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:9px}
.ph h2{font-size:19px;font-weight:800;color:var(--primary)}
.es{text-align:center;padding:44px;color:var(--muted)}.es .ei{font-size:44px;margin-bottom:10px}
code{background:#f3f4f6;padding:2px 5px;border-radius:4px;font-size:11px;font-family:monospace}
.tab-btns{display:flex;gap:0;margin-bottom:16px;border-radius:8px;overflow:hidden;border:1.5px solid var(--primary);width:fit-content}
.tab-btn{padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:#fff;color:var(--primary);transition:background .15s}
.tab-btn.active{background:var(--primary);color:#fff}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div id="sb">
  <div class="sb-head">
    <div class="sb-logo">
      <div id="sb-logo-wrap"><div class="sb-icon">📦</div></div>
      <div class="sb-txt">
        <div class="sys" id="sb-sys">SCV - Sistema de Controle de Validade</div>
        <div class="co"  id="sb-co">R&J LOGISTICS</div>
      </div>
    </div>
    <div class="uchip">
      <div class="uav" id="sb-av">A</div>
      <div class="uinfo">
        <div class="un" id="sb-un">{{ user_nome }}</div>
        <div class="ur" id="sb-ur">{{ user_perfil }}</div>
      </div>
    </div>
  </div>
  <nav>
    <div class="ns">Principal</div>
    <div class="ni" data-p="dashboard" onclick="go('dashboard')"><span class="ic">📊</span>Dashboard</div>
    <div class="ni" data-p="alertas"   onclick="go('alertas')">  <span class="ic">🔔</span>Alertas<span class="nbadge" id="bdg-al" style="display:none">0</span></div>
    <div class="ni" data-p="estoque"   onclick="go('estoque')">  <span class="ic">📦</span>Estoque</div>
    <div class="ns">Dados</div>
    <div class="ni" data-p="import"    onclick="go('import')">   <span class="ic">📥</span>Importação</div>
    <div class="ni" data-p="filiais"   onclick="go('filiais')">  <span class="ic">🏢</span>Filiais</div>
    <div class="ns">Análise</div>
    <div class="ni" data-p="relat"     onclick="go('relat')">    <span class="ic">📋</span>Relatórios</div>
    <div class="ns" id="ns-adm" style="display:none">Admin</div>
    <div class="ni" data-p="users"  onclick="go('users')"  id="ni-usr" style="display:none"><span class="ic">👥</span>Usuários<span class="nbadge" id="bdg-pend" style="display:none">0</span></div>
    <div class="ni" data-p="audit"  onclick="go('audit')"  id="ni-aud" style="display:none"><span class="ic">🔍</span>Auditoria</div>
    <div class="ni" data-p="config" onclick="go('config')" id="ni-cfg" style="display:none"><span class="ic">⚙️</span>Configurações</div>
  </nav>
  <div class="sb-foot">
    <button class="btnout" onclick="location.href='/logout'">↩ Sair</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div class="pt" id="tb-title">Dashboard</div>
    <div style="font-size:11px;color:var(--muted)" id="tb-clock"></div>
  </div>
  <div id="content"><div class="es"><div class="ei">⏳</div><p>Carregando...</p></div></div>
</div>

<!-- MODAL -->
<div class="mo" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mb"><div class="mt" id="m-title"></div><div id="m-body"></div><div class="mf" id="m-foot"></div></div>
</div>
<div id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
const S={
  page:'dashboard', perfil:'{{ user_perfil }}', nome:'{{ user_nome }}',
  filiais:[], settings:{},
  // filters
  dashFil:'', alFil:'', alNiv:'', alIni:'', alFim:'', alRes:'0',
  estFil:'', estCat:'', estNiv:'', estIni:'', estFim:'', estSrch:'', estVend:'0',
  relTipo:'alertas', relFil:'', relNiv:'', relIni:'', relFim:'', relRes:'', relMotivo:'',
  audAct:'', audIni:'', audFim:'',
  _estData:[], _alData:[],
};

const PAGE_TITLES={dashboard:'Dashboard',alertas:'Alertas',estoque:'Estoque',
  import:'Importação de Planilhas',filiais:'Filiais',relat:'Relatórios',
  users:'Gestão de Usuários',audit:'Auditoria',config:'Configurações'};

// ── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',async()=>{
  clk(); setInterval(clk,1000);
  document.getElementById('sb-av').textContent=S.nome.charAt(0).toUpperCase();
  setupAdminNav();
  await loadSettings(); await loadFiliais();
  await loadBadgeAlertas(); if(S.perfil==='admin') await loadBadgePend();
  go('dashboard');
  setInterval(async()=>{await loadBadgeAlertas();if(S.perfil==='admin')await loadBadgePend();renderPage();},60000);
});

function setupAdminNav(){
  if(S.perfil==='admin'){
    ['ns-adm','ni-usr','ni-aud','ni-cfg'].forEach(id=>document.getElementById(id).style.display='');
  } else if(S.perfil==='auditor'){
    document.getElementById('ns-adm').style.display='';
    document.getElementById('ni-aud').style.display='';
  }
}

function go(page){
  S.page=page;
  document.querySelectorAll('.ni').forEach(el=>el.classList.toggle('active',el.dataset.p===page));
  document.getElementById('tb-title').textContent=PAGE_TITLES[page]||page;
  renderPage();
}

function renderPage(){
  const fns={dashboard:renderDashboard,alertas:renderAlertas,estoque:renderEstoque,
    import:renderImport,filiais:renderFiliais,relat:renderRelat,
    users:renderUsers,audit:renderAudit,config:renderConfig};
  (fns[S.page]||(() => {}))();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function clk(){
  document.getElementById('tb-clock').textContent=
    new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR');
}

async function api(url,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadFiliais(){try{S.filiais=await api('/api/filiais');}catch{}}
async function loadSettings(){
  try{
    S.settings=await api('/api/settings');
    const sys=S.settings.nome_sistema||'SCV - Sistema de Controle de Validade';
    const emp=S.settings.nome_empresa||'R&J Logistics';
    document.getElementById('sb-sys').textContent=sys;
    document.getElementById('sb-co').textContent=emp.toUpperCase();
    document.title=sys+' — SCV';
    // Logo
    const logo=S.settings.logo_base64||'';
    const wrap=document.getElementById('sb-logo-wrap');
    if(logo){wrap.innerHTML=`<img src="${logo}" style="height:38px;width:38px;border-radius:8px;object-fit:contain">`;}
    else{wrap.innerHTML='<div class="sb-icon">📦</div>';}
  }catch{}
}
async function loadBadgeAlertas(){
  try{const d=await api('/api/alertas?resolvido=0');const n=d.length;const b=document.getElementById('bdg-al');b.textContent=n;b.style.display=n>0?'':'none';}catch{}
}
async function loadBadgePend(){
  try{const d=await api('/api/usuarios');const n=(d.pending||[]).length;const b=document.getElementById('bdg-pend');b.textContent=n;b.style.display=n>0?'':'none';}catch{}
}

function showToast(msg,type='success'){
  const t=document.createElement('div');t.className=`ti ${type}`;t.textContent=msg;
  document.getElementById('toast').appendChild(t);setTimeout(()=>t.remove(),3500);
}
function openModal(title,body,foot){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-body').innerHTML=body;
  document.getElementById('m-foot').innerHTML=foot||'<button class="btn bg" onclick="closeModal()">Fechar</button>';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

function filOpts(sel='',all=true){
  let o=all?'<option value="">Todas as filiais</option>':'<option value="">Selecione a filial...</option>';
  S.filiais.forEach(f=>{o+=`<option value="${f.id}" ${String(sel)===String(f.id)?'selected':''}>${f.nome} (${f.codigo})</option>`;});
  return o;
}
function nivOpts(sel=''){
  return [['','Todos os níveis'],['critico','🔴 Crítico'],['atencao','🟡 Atenção'],['ok','🟢 OK']]
    .map(([v,l])=>`<option value="${v}" ${v===sel?'selected':''}>${l}</option>`).join('');
}
function fmtDt(dt){if(!dt)return'—';try{return new Date(dt).toLocaleString('pt-BR');}catch{return dt;}}
function fmtN(v){if(v==null)return'—';return Number(v).toLocaleString('pt-BR');}
function badgeLbl(n){return{critico:'🔴 Crítico',atencao:'🟡 Atenção',ok:'🟢 OK',sem_estoque:'⚫ Sem Estoque'}[n]||n;}
function today(){return new Date().toISOString().slice(0,10);}
function dlFile(content,name,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

// ══ DASHBOARD ══════════════════════════════════════════════════════════════════
async function renderDashboard(){
  let data;
  try{data=await api(`/api/dashboard?filial_id=${S.dashFil||''}`);}
  catch{document.getElementById('content').innerHTML='<div class="ib red">Erro ao carregar.</div>';return;}
  const maxT=Math.max(...(data.tendencia_7d||[]).map(d=>d.alertas),1);
  document.getElementById('content').innerHTML=`
  <div class="ph">
    <h2>📊 Dashboard</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select class="fc" style="min-width:160px" onchange="S.dashFil=this.value;renderDashboard()">${filOpts(S.dashFil)}</select>
      <button class="btn bg bsm" onclick="S.dashFil='';renderDashboard()">Limpar</button>
    </div>
  </div>
  <div class="kgrid">
    <div class="kpi"><div class="kv">${data.total_itens}</div><div class="kl">Total de Itens</div></div>
    <div class="kpi dn"><div class="kv">${data.criticos}</div><div class="kl">🔴 Itens Críticos</div></div>
    <div class="kpi wn"><div class="kv">${data.alertas_ativos}</div><div class="kl">🔔 Alertas Ativos</div></div>
    <div class="kpi ac"><div class="kv">${(data.por_nivel||[]).find(p=>p.nivel==='atencao')?.total||0}</div><div class="kl">🟡 Em Atenção</div></div>
  </div>
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:18px">
    <div class="card">
      <div class="ct">📈 Alertas — Últimos 7 Dias</div>
      <div class="cbw" id="chart"></div>
    </div>
    <div class="card">
      <div class="ct">🔔 Por Nível</div>
      ${(data.por_nivel||[]).length?data.por_nivel.map(p=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--brd)"><span class="badge b${p.nivel==='critico'?'c':p.nivel==='atencao'?'w':'ok'}">${badgeLbl(p.nivel)}</span><strong>${p.total}</strong></div>`).join(''):'<div class="es" style="padding:16px"><div class="ei" style="font-size:32px">✅</div><p>Nenhum alerta ativo</p></div>'}
    </div>
  </div>
  <div class="card">
    <div class="ct">⚡ Ações Rápidas</div>
    <div style="display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn ba" onclick="go('alertas')">🔔 Ver Alertas</button>
      <button class="btn bo" onclick="go('estoque')">📦 Ver Estoque</button>
      <button class="btn bo" onclick="go('import')">📥 Importar Planilha</button>
      ${S.perfil!=='viewer'?'<button class="btn bp" onclick="rodarEngine()">⚙️ Rodar Engine de Alertas</button>':''}
    </div>
  </div>`;
  const ch=document.getElementById('chart');
  if(ch&&data.tendencia_7d){
    ch.innerHTML=data.tendencia_7d.map(d=>{
      const h=Math.max(Math.round((d.alertas/maxT)*100),d.alertas>0?6:2);
      return`<div class="bc2"><div class="bv">${d.alertas||''}</div><div class="br" style="height:${h}px;background:${d.alertas>0?'var(--dn)':'var(--brd)'}"></div><div class="bl">${d.data.slice(5).replace('-','/')}</div></div>`;
    }).join('');
  }
}

// ══ ALERTAS ════════════════════════════════════════════════════════════════════
async function renderAlertas(){
  let data;
  try{data=await api(`/api/alertas?filial_id=${S.alFil}&nivel=${S.alNiv}&data_ini=${S.alIni}&data_fim=${S.alFim}&resolvido=${S.alRes}`);}
  catch{document.getElementById('content').innerHTML='<div class="ib red">Erro.</div>';return;}
  S._alData=data;
  const rows=data.map(a=>`<tr>
    <td>${a.filial_nome||'-'}</td><td><code>${a.codigo_produto}</code></td>
    <td>${a.produto_nome||'-'}</td>
    <td><span class="badge b${a.nivel==='critico'?'c':a.nivel==='atencao'?'w':'ok'}">${badgeLbl(a.nivel)}</span></td>
    <td>${a.cobertura_dias!=null?a.cobertura_dias+' dias':'—'}</td>
    <td>${a.validade||'—'}</td>
    <td style="font-size:11px;color:var(--muted)">${fmtDt(a.criado_em)}</td>
    <td>
      ${!a.resolvido
        ? `<div style="display:flex;gap:3px;flex-wrap:wrap">
            <button class="btn bs bsm" onclick="darBaixaAlerta(${a.id},'vendido')" title="Estoque vendido">✔ Vendido</button>
            <button class="btn bsm" style="background:#6b7280;color:#fff;padding:4px 7px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none" onclick="darBaixaAlerta(${a.id},'descarte')" title="Descartar">🗑 Descarte</button>
            <button class="btn bsm" style="background:#7c3aed;color:#fff;padding:4px 7px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none" onclick="darBaixaAlerta(${a.id},'devolucao')" title="Devolução ao fornecedor">↩ Devolução</button>
          </div>`
        : `<span style="font-size:11px;color:var(--muted)">${a.motivo_baixa==='descarte'?'🗑 Descarte':a.motivo_baixa==='devolucao'?'↩ Devolução':'✔ Vendido'} em ${fmtDt(a.resolvido_em)}</span>`
      }
    </td>
  </tr>`).join('');
  document.getElementById('content').innerHTML=`
  <div class="ph"><h2>🔔 Alertas</h2>${S.perfil!=='viewer'?'<button class="btn bp" onclick="rodarEngine()">⚙️ Rodar Engine</button>':''}</div>
  <div class="fbar">
    <div class="fg"><label>Filial</label><select class="fc" onchange="S.alFil=this.value;renderAlertas()">${filOpts(S.alFil)}</select></div>
    <div class="fg"><label>Nível</label><select class="fc" onchange="S.alNiv=this.value;renderAlertas()">${nivOpts(S.alNiv)}</select></div>
    <div class="fg"><label>De</label><input type="date" class="fc" value="${S.alIni}" onchange="S.alIni=this.value;renderAlertas()"></div>
    <div class="fg"><label>Até</label><input type="date" class="fc" value="${S.alFim}" onchange="S.alFim=this.value;renderAlertas()"></div>
    <div class="fg"><label>Status</label><select class="fc" onchange="S.alRes=this.value;renderAlertas()">
      <option value="0" ${S.alRes==='0'?'selected':''}>Ativos</option>
      <option value="1" ${S.alRes==='1'?'selected':''}>Resolvidos</option>
    </select></div>
    <div class="fg" style="flex:0"><label>&nbsp;</label><button class="btn bg" onclick="S.alFil='';S.alNiv='';S.alIni='';S.alFim='';S.alRes='0';renderAlertas()">Limpar</button></div>
  </div>
  <div class="card">
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">${data.length} alerta(s)</div>
    ${data.length?`<div class="tw"><table><thead><tr><th>Filial</th><th>Código</th><th>Produto</th><th>Nível</th><th>Cobertura</th><th>Validade</th><th>Gerado em</th><th>Ação</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="es"><div class="ei">✅</div><p>Nenhum alerta com os filtros aplicados.</p></div>'}
  </div>`;
}

async function darBaixaAlerta(id, motivo){
  const labels={vendido:'vendido',descarte:'descartado',devolucao:'devolvido ao fornecedor'};
  if(!confirm(`Confirmar que o estoque foi ${labels[motivo]}?`)) return;
  try{
    // Resolve o alerta com motivo
    await api(`/api/alertas/${id}/resolver`,'POST',{motivo});
    showToast(`✅ Registrado: ${labels[motivo]}`);
    await loadBadgeAlertas();
    renderAlertas();
  }catch{showToast('Erro','error');}
}

async function rodarEngine(){
  const btn=event.target; btn.disabled=true; btn.textContent='⏳ Rodando...';
  try{
    const r=await api('/api/alertas/rodar','POST',{filial_id:S.alFil||null});
    showToast(`Engine executada — ${r.gerados} alerta(s) gerado(s)`);
    await loadBadgeAlertas(); renderPage();
  }catch{showToast('Erro ao rodar engine','error');}
  finally{btn.disabled=false;btn.textContent='⚙️ Rodar Engine';}
}

async function darBaixa(id, motivo){
  const labels = {vendido:'vendido', descarte:'descartado', devolucao:'devolvido ao fornecedor'};
  const icons  = {vendido:'✔', descarte:'🗑', devolucao:'↩'};
  if(!confirm(`Confirmar que o estoque foi ${labels[motivo]}? O alerta será resolvido automaticamente.`)) return;
  try{
    await api(`/api/estoque/${id}/marcar-vendido`,'POST',{motivo});
    showToast(`Item registrado: ${icons[motivo]} ${labels[motivo]}!`);
    await loadBadgeAlertas();
    renderEstoque();
  }catch{showToast('Erro','error');}
}

function exportEstCSV(){
  if(!S._estData.length)return showToast('Sem dados','warn');
  const cols=['codigo_produto','descricao','filial_nome','categoria','localizacao','estoque_atual','unidade_medida','venda_media_diaria','cobertura_dias','nivel_alerta','validade','data_referencia'];
  dlFile('\uFEFF'+[cols.join(';'),...S._estData.map(r=>cols.map(c=>r[c]??'').join(';'))].join('\n'),`estoque_${today()}.csv`,'text/csv');
}

async function salvarEstoqueManual(){
  const d={
    filial_id:document.getElementById('em-fil').value||null,
    codigo_produto:document.getElementById('em-cod').value.trim(),
    descricao:document.getElementById('em-desc').value.trim(),
    estoque_atual:document.getElementById('em-est').value,
    validade:document.getElementById('em-val').value,
    unidade_medida:document.getElementById('em-un').value||'UN',
    categoria:document.getElementById('em-cat').value||'',
    localizacao:document.getElementById('em-loc').value.trim()||'',
    data_referencia:document.getElementById('em-dr').value,
  };
  if(!d.filial_id||!d.codigo_produto||!d.descricao||!d.estoque_atual||!d.validade)
    return showToast('Preencha todos os campos obrigatórios','warn');

  }catch(e){showToast('Erro: '+e.message,'error');}

function showTab(tab){
  document.getElementById('section-est').style.display=tab==='est'?'':'none';
  document.getElementById('section-vnd').style.display=tab==='vnd'?'':'none';
  document.getElementById('tab-est').classList.toggle('active',tab==='est');
  document.getElementById('tab-vnd').classList.toggle('active',tab==='vnd');
}

async function importar(tipo){
  const isEst=tipo==='estoque'; const k=isEst?'e':'v';
  const fil=document.getElementById(isEst?'ie-fil':'iv-fil').value;
  const cod=document.getElementById(isEst?'ie-cod':'iv-cod').value.trim().toUpperCase();
  if(!fil&&!cod)return showToast('Informe a filial ou o código da filial','warn');
  if(!_files[k])return showToast('Selecione o arquivo','warn');
  const btn=document.getElementById(`btn-i${k}`); btn.disabled=true; btn.textContent='⏳ Processando...';
  const fd=new FormData(); fd.append('file',_files[k]);
  if(fil) fd.append('filial_id',fil); else fd.append('filial_codigo',cod);
  try{
    const r=await fetch(`/api/import/${tipo}`,{method:'POST',body:fd});
    const d=await r.json();
    const resEl=document.getElementById(`res-${k}`);
    if(d.error){resEl.innerHTML=`<div class="ib red">❌ ${d.error}</div>`;return;}
    let msg=`✅ ${d.inserted||0} inseridos · ${d.updated||0} atualizados · ${(d.errors||[]).length||d.errors||0} erros`;
    if(d.vmd_atualizados) msg+=` · ${d.vmd_atualizados} VMDs recalculados`;
    resEl.innerHTML=`<div class="ib grn">${msg}</div>`;
    if((d.errors||[]).length) resEl.innerHTML+=`<div class="ib red">${(d.errors||[]).map(e=>`<div>${e}</div>`).join('')}</div>`;
    showToast('Importação concluída!');
    loadHist(isEst?'est':'vnd');
  }catch(e){document.getElementById(`res-${k}`).innerHTML=`<div class="ib red">❌ Erro: ${e.message}</div>`;}
  finally{btn.disabled=false;btn.textContent='📤 Importar';}
}

    codigo_produto:document.getElementById('me-cod').value.trim(),

    estoque_atual:document.getElementById('me-est').value,
    validade:document.getElementById('me-val').value,
    unidade_medida:document.getElementById('me-un').value||'UN',
    categoria:document.getElementById('me-cat').value||'',
    localizacao:document.getElementById('me-loc').value.trim()||'',
    data_referencia:document.getElementById('me-dr').value,
  };
  if(!d.filial_id||!d.codigo_produto||!d.descricao||!d.estoque_atual||!d.validade)
    return showToast('Preencha todos os campos obrigatórios','warn');
  try{
    const r=await api('/api/estoque/manual','POST',d);
    document.getElementById('res-me').innerHTML=`<div class="ib grn">✅ ${r.action==='updated'?'Item atualizado!':'Item inserido com sucesso!'}</div>`;

    ['me-cod','me-desc','me-est','me-un','me-cat','me-loc'].forEach(id=>{const el=document.getElementById(id);if(el){el.value=id==='me-un'?'UN':'';} });

async function lancarVendaManual(){
  const d={
    filial_id:document.getElementById('mv-fil').value||null,
    codigo_produto:document.getElementById('mv-cod').value.trim(),
    quantidade:document.getElementById('mv-qtd').value,
    data_venda:document.getElementById('mv-dt').value,
    numero_nf:document.getElementById('mv-nf').value.trim()||null,
  };
  if(!d.filial_id||!d.codigo_produto||!d.quantidade||!d.data_venda)
    return showToast('Preencha todos os campos obrigatórios','warn');
  try{
    await api('/api/vendas/manual','POST',d);
    document.getElementById('res-mv').innerHTML='<div class="ib grn">✅ Venda lançada! VMD recalculada.</div>';
    showToast('Venda lançada!');
    ['mv-cod','mv-qtd','mv-nf'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});

async function loadHist(tipo){
  const el=document.getElementById(`hist-${tipo}`); if(!el)return;
  const apiTipo=tipo==='est'?'estoque':'vendas';
  try{
    const data=await api(`/api/imports-log?tipo=${apiTipo}&limit=15`);
    if(!data.length){el.innerHTML='<div class="card"><div class="ct">Histórico de Importações</div><div class="es" style="padding:16px"><p>Nenhuma importação registrada.</p></div></div>';return;}
    el.innerHTML=`<div class="card"><div class="ct">📋 Histórico de Importações</div><div class="tw"><table>
      <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Filial</th><th>Inseridos</th><th>Atualizados</th><th>Erros</th></tr></thead>
      <tbody>${data.map(r=>`<tr>
        <td style="font-size:11px">${fmtDt(r.criado_em)}</td>
        <td>${r.user_name||'-'}</td><td>${r.filial_nome||'-'}</td>
        <td>${r.inseridos}</td><td>${r.atualizados}</td>
        <td ${r.erros>0?'style="color:var(--dn);font-weight:700"':''}>${r.erros}</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  }catch{el.innerHTML='';}
}

      <div class="ct">🎨 Identidade Visual</div>

      <div class="ib blue" style="font-size:12px;margin-bottom:16px">
        <strong>Linha 1 do sidebar</strong> → Título do Sistema &nbsp;|&nbsp; <strong>Linha 2 do sidebar</strong> → Nome da Empresa<br>
        O <strong>Slogan</strong> aparece apenas na tela de login.
      </div>

      <div class="fg">
        <label>Título do Sistema (linha 1 do menu)</label>
        <input id="cfg-nome_sistema" class="fc" placeholder="Ex: SCV - Sistema de Controle de Validade" value="${cfg.nome_sistema||''}">
      </div>
      <div class="fg">
        <label>Nome da Empresa (linha 2 do menu)</label>
        <input id="cfg-nome_empresa" class="fc" placeholder="Ex: RBM LOGISTICS" value="${cfg.nome_empresa||''}">
      </div>
      <div class="fg">
        <label>Slogan (aparece apenas na tela de login)</label>
        <input id="cfg-slogan_login" class="fc" placeholder="Ex: Controle de validade com precisão" value="${cfg.slogan_login||''}">
      </div>
      <div class="fg">
        <label>Logo (PNG, JPG, SVG)</label>
        <div style="display:flex;gap:10px;align-items:center">
          ${cfg.logo_base64?`<img src="${cfg.logo_base64}" style="height:48px;border-radius:8px;border:1px solid var(--brd)">`:
            '<div style="width:48px;height:48px;border-radius:8px;background:var(--bg);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:22px">📦</div>'}
          <input type="file" id="logo-file" accept=".png,.jpg,.jpeg,.gif,.svg,.webp" style="display:none" onchange="uploadLogo(this)">
          <button class="btn bo bsm" onclick="document.getElementById('logo-file').click()">📷 Alterar Logo</button>
          ${cfg.logo_base64?'<button class="btn bd bsm" onclick="removerLogo()">🗑 Remover</button>':''}
        </div>
        <div id="logo-status" style="margin-top:8px"></div>
      </div>
      <button class="btn bp" onclick="salvarConfig(['nome_sistema','nome_empresa','slogan_login'])">💾 Salvar Identidade</button>
    </div>

    <!-- Alertas -->
    <div class="card">
      <div class="ct">🔔 Parâmetros de Alerta</div>
      <div class="fg"><label>Modo de Alerta</label>
        <select id="cfg-modo_alerta" class="fc">
          <option value="both" ${cfg.modo_alerta==='both'?'selected':''}>Cobertura + Validade</option>
          <option value="cobertura" ${cfg.modo_alerta==='cobertura'?'selected':''}>Somente Cobertura</option>
          <option value="validade" ${cfg.modo_alerta==='validade'?'selected':''}>Somente Validade</option>
        </select>
      </div>
      <div class="frow">
        <div class="fg"><label>Folga Crítica (dias restantes na validade após vender tudo ≤)</label><input id="cfg-dias_critico" class="fc" type="number" min="1" value="${cfg.dias_critico||15}"></div>
        <div class="fg"><label>Folga Atenção (dias restantes na validade após vender tudo ≤)</label><input id="cfg-dias_atencao" class="fc" type="number" min="1" value="${cfg.dias_atencao||30}"></div>
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 8px;text-transform:uppercase;letter-spacing:.5px">⏱ Parâmetros de Validade (quando sem VMD)</div>
      <div class="frow">
        <div class="fg">
          <label>Dias Crítico por Validade (≤)</label>
          <input id="cfg-val_dias_critico" class="fc" type="number" min="1" value="${cfg.val_dias_critico||30}">
          <small style="font-size:10px;color:var(--muted)">Vence em ≤ N dias → 🔴 Crítico</small>
        </div>
        <div class="fg">
          <label>Dias Atenção por Validade (≤)</label>
          <input id="cfg-val_dias_atencao" class="fc" type="number" min="1" value="${cfg.val_dias_atencao||90}">
          <small style="font-size:10px;color:var(--muted)">Vence em ≤ N dias → 🟡 Atenção</small>
        </div>
      </div>
      <button class="btn bp" onclick="salvarConfig(['modo_alerta','dias_critico','dias_atencao','val_dias_critico','val_dias_atencao'])">💾 Salvar Parâmetros</button>
    </div>
  </div>`;
}

async function salvarConfig(keys){
  const d={};
  keys.forEach(k=>{const el=document.getElementById(`cfg-${k}`);if(el)d[k]=el.value;});
  try{
    await api('/api/settings','POST',d);
    showToast('Configurações salvas!');
    // Atualiza sidebar imediatamente
    await loadSettings();
    renderConfig();
  }catch{showToast('Erro ao salvar','error');}
}

async function uploadLogo(input){
  const f=input.files[0]; if(!f)return;
  const st=document.getElementById('logo-status');
  st.innerHTML='<span style="color:var(--muted);font-size:12px">⏳ Enviando...</span>';
  const fd=new FormData(); fd.append('logo',f);
  try{
    const r=await fetch('/api/settings/logo',{method:'POST',body:fd});
    const d=await r.json();
    if(d.error){st.innerHTML=`<span style="color:var(--dn);font-size:12px">❌ ${d.error}</span>`;return;}
    showToast('Logo atualizado!');
    await loadSettings(); renderConfig();
  }catch{st.innerHTML='<span style="color:var(--dn);font-size:12px">❌ Erro ao enviar.</span>';}
}

async function removerLogo(){
  if(!confirm('Remover o logo?'))return;
  try{
    await api('/api/settings','POST',{logo_base64:''});
    showToast('Logo removido.','warn');
    await loadSettings(); renderConfig();
  }catch{showToast('Erro','error');}
}
</script>
</body>
</html>
