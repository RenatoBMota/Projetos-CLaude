<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SCV — Solicitar Acesso</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a4e8f,#1a2e4a);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:44px 40px;width:100%;max-width:420px}
    .back{font-size:13px;color:#6b7280;margin-bottom:20px;display:block}<a href="/login" style="color:#1a4e8f;text-decoration:none">← Voltar ao login</a>
    h2{font-size:22px;font-weight:700;color:#1a4e8f;margin-bottom:6px}
    p.sub{font-size:13px;color:#6b7280;margin-bottom:24px}
    label{display:block;font-size:13px;color:#374151;font-weight:600;margin-bottom:6px}
    input[type=text],input[type=email]{width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:18px;transition:border .2s}
    input:focus{outline:none;border-color:#1a4e8f;box-shadow:0 0 0 3px rgba(26,78,143,.12)}
    .btn{width:100%;padding:12px;background:#1a4e8f;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
    .btn:hover{background:#153f75}
    .error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
    .footer{text-align:center;margin-top:18px;font-size:13px;color:#6b7280}
    .footer a{color:#1a4e8f;font-weight:600;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <a href="/login" style="font-size:13px;color:#1a4e8f;text-decoration:none;display:block;margin-bottom:20px">← Voltar ao login</a>
    <h2>Solicitar Acesso</h2>
    <p class="sub">Preencha seus dados. O administrador aprovará seu cadastro.</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST">
      <label>Nome completo</label>
      <input type="text" name="nome" placeholder="Seu nome" required autofocus>
      <label>Email corporativo</label>
      <input type="email" name="email" placeholder="seu@empresa.com" required>
      <button type="submit" class="btn">Enviar Solicitação</button>
    </form>

    <div class="footer">Já tem acesso? <a href="/login">Faça login</a></div>
  </div>
</body>
</html>
