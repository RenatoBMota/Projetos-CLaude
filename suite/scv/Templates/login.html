<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCV — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a4e8f 0%,#1a2e4a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:44px 40px;width:100%;max-width:420px}
    .logo-area{text-align:center;margin-bottom:32px}
    .logo-area img{height:64px;margin-bottom:12px}
    .logo-area .sys-name{font-size:26px;font-weight:700;color:#1a4e8f;letter-spacing:1px}
    .logo-area .company{font-size:13px;color:#e8a020;font-weight:600;margin-top:2px}
    .logo-area .slogan{font-size:12px;color:#6b7280;margin-top:4px}
    .divider{height:1px;background:#e5e7eb;margin:20px 0}
    label{display:block;font-size:13px;color:#374151;font-weight:600;margin-bottom:6px}
    input[type=email],input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:18px;transition:border .2s,box-shadow .2s;color:#111}
    input:focus{outline:none;border-color:#1a4e8f;box-shadow:0 0 0 3px rgba(26,78,143,.12)}
    .btn-primary{width:100%;padding:12px;background:#1a4e8f;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;letter-spacing:.3px}
    .btn-primary:hover{background:#153f75}
    .error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px}
    .footer-links{text-align:center;margin-top:22px;font-size:13px;color:#6b7280}
    .footer-links a{color:#1a4e8f;text-decoration:none;font-weight:600}
    .footer-links a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-area">
      <div id="logo-img-wrap"></div>
      <div class="sys-name" id="sys-name">SCV - Sistema de Controle de Validade</div>
      <div class="company" id="company-name">R&J LOGISTICS</div>
      <div class="slogan" id="company-slogan"></div>
    </div>
    <div class="divider"></div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Email</label>
      <input type="email" name="email" placeholder="seu@email.com" required autofocus>
      <label>Senha</label>
      <input type="password" name="senha" placeholder="••••••••" required>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <div class="footer-links">
      <a href="/register">Solicitar acesso</a>
    </div>
  </div>

  <script>
    fetch('/api/settings/public').then(r=>r.json()).then(d=>{
      document.getElementById('sys-name').textContent      = d.nome_sistema || 'SCV - Sistema de Controle de Validade';
      document.getElementById('company-name').textContent   = (d.nome_empresa || 'R&J LOGISTICS').toUpperCase();
      document.getElementById('company-slogan').textContent = d.slogan_login || '';
      document.title = (d.nome_sistema||'SCV') + ' — Login';
    }).catch(()=>{});
  </script>
</body>
</html>
