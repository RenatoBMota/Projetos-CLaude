<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha | {{ app_nome }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    :root { --primary: {{ cor_primaria }}; --sidebar: {{ cor_sidebar }}; }
    body {
      background: linear-gradient(135deg, var(--sidebar) 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      width: 420px; max-width: 95vw;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .login-header {
      background: var(--sidebar);
      padding: 2rem;
      text-align: center;
    }
    .login-header .logo-wrapper {
      width: 72px; height: 72px; border-radius: 16px;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,.3);
    }
    .login-header h1 { color: #fff; font-size: 1.4rem; font-weight: 800; margin: 0; }
    .login-header p  { color: rgba(255,255,255,.55); font-size: .8rem; margin: .25rem 0 0; }
    .login-body { padding: 2rem; }
    .form-label { font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: #475569; }
    .form-control { padding: .75rem 1rem; border-color: #e2e8f0; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .btn-login {
      background: var(--primary); border: none; color: #fff;
      padding: .85rem; font-weight: 700; font-size: 1rem;
      border-radius: 10px; width: 100%; letter-spacing: .02em;
    }
    .btn-login:hover { filter: brightness(1.1); color: #fff; }
    .input-group-text { background: #f8fafc; border-color: #e2e8f0; color: #94a3b8; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="logo-wrapper">
      <i class="fa-solid fa-envelope-open-text fa-2x text-white"></i>
    </div>
    <h1>Esqueci minha senha</h1>
    <p>Enviaremos uma senha provisória para seu e-mail</p>
  </div>

  <div class="login-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 mb-3" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>{{ msg }}
      </div>
      {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.esqueci_senha') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}">
      <div class="mb-4">
        <label class="form-label">E-mail cadastrado</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
          <input type="email" name="email" class="form-control"
                 placeholder="seu@email.com" required autofocus>
        </div>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="fa-solid fa-paper-plane me-2"></i>Enviar Senha Provisória
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <a href="{{ url_for('auth.login') }}" class="text-decoration-none" style="font-size:.85rem;">
        <i class="fa-solid fa-arrow-left me-1"></i>Voltar ao login
      </a>
    </div>
  </div>
</div>
</body>
</html>
