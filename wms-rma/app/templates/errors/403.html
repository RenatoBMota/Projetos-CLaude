{% extends 'base.html' %}
{% block title %}Acesso Negado{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center" style="min-height:60vh;">
  <div class="text-center">
    <div style="font-size:5rem;color:#e2e8f0;">
      <i class="fa-solid fa-shield-halved"></i>
    </div>
    <h2 class="mt-3 fw-bold text-danger">Acesso Negado</h2>
    <p class="text-muted mb-4">
      Seu perfil (<strong>{{ current_user.role_label }}</strong>) não tem permissão para acessar esta tela.<br>
      Fale com o administrador do sistema se precisar desse acesso.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-custom">
      <i class="fa-solid fa-house me-1"></i>Voltar ao Dashboard
    </a>
  </div>
</div>
{% endblock %}
