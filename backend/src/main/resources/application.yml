spring:
  application:
    name: rbm-agendamento
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rbm_agendamento}
    username: ${DB_USERNAME:rbm_user}
    password: ${DB_PASSWORD:rbm_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: schema_version

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:rbm_redis_pass}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rbm_user}
    password: ${RABBITMQ_PASSWORD:rbm_password}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: RBM LOGISTICS – Agendamento Logístico
    description: API do Módulo Corporativo de Agendamento Logístico
    version: v1.0.0

app:
  security:
    jwt:
      secret: ${JWT_SECRET:rbm-agendamento-jwt-secret-key-2024-enterprise-logistics}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:rbm_minio}
    secret-key: ${MINIO_SECRET_KEY:rbm_minio_secret}
    bucket-documents: rbm-documentos
    bucket-attachments: rbm-anexos
  notification:
    email:
      enabled: ${NOTIF_EMAIL_ENABLED:false}
      from: ${NOTIF_EMAIL_FROM:noreply@rbmlogistics.com.br}
      from-name: ${NOTIF_EMAIL_FROM_NAME:RBM Logistics}
    whatsapp:
      enabled: ${NOTIF_WHATSAPP_ENABLED:false}
      webhook-url: ${NOTIF_WHATSAPP_WEBHOOK_URL:}
      api-key: ${NOTIF_WHATSAPP_API_KEY:}
  integracao:
    yms:
      enabled: ${YMS_ENABLED:false}
      base-url: ${YMS_BASE_URL:http://localhost:5000}
      api-key: ${YMS_API_KEY:}
      webhook-secret: ${YMS_WEBHOOK_SECRET:rbm-yms-webhook-secret}

spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
