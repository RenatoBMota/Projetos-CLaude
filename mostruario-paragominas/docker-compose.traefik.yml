# Usado quando a VPS já tem um Traefik nas portas 80/443 (ex.: o do n8n da
# Hostinger). O instalar_vps.sh detecta e grava no .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml
#   TRAEFIK_REDE, TRAEFIK_ENTRYPOINT e TRAEFIK_RESOLVER (lidos do próprio Traefik)
services:
  app:
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_REDE}
      - traefik.http.routers.mostruario.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.mostruario.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.mostruario.tls=true
      - traefik.http.routers.mostruario.tls.certresolver=${TRAEFIK_RESOLVER}
      - traefik.http.routers.mostruario.middlewares=mostruario-seguranca
      - traefik.http.middlewares.mostruario-seguranca.headers.stsSeconds=31536000
      - traefik.http.middlewares.mostruario-seguranca.headers.contentTypeNosniff=true
      - traefik.http.middlewares.mostruario-seguranca.headers.frameDeny=true
      - traefik.http.middlewares.mostruario-seguranca.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.services.mostruario.loadbalancer.server.port=8000
    networks:
      - default
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_REDE}
