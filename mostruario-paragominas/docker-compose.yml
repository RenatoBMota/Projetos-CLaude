services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mostruario
      POSTGRES_PASSWORD: ${DB_SENHA:?defina DB_SENHA no arquivo .env}
    volumes:
      - dados:/var/lib/postgresql/data
      # Executado apenas na primeira inicialização (banco vazio).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mostruario"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:${DB_SENHA}@db:5432/mostruario
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
    volumes:
      - anexos:/dados/anexos
    # Acesso direto só de dentro do servidor; o público entra pelo Caddy (HTTPS).
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Usado só quando a VPS não tem outro proxy nas portas 80/443
  # (o instalar_vps.sh decide e grava COMPOSE_PROFILES no .env).
  caddy:
    profiles: ["caddy"]
    image: caddy:2.8
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dados:
  anexos:
  caddy_dados:
  caddy_config:
