<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Controle de amostras de pisos do mostruário" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mostruário" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mostruário Paragominas</title>
    <script>
      // Aplica o tema salvo antes de desenhar a tela (evita piscar)
      try {
        var t = localStorage.getItem("mostruario.tema");
        if (t === "claro" || t === "escuro") document.documentElement.dataset.theme = t === "claro" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
