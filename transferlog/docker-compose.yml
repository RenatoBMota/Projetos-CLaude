services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transferlog
      POSTGRES_USER: transferlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transferlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://transferlog:${POSTGRES_PASSWORD}@db:5432/transferlog?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3333
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Não expõe portas para o host: o Traefik já existente no VPS (rede
  # "proxy" abaixo) é quem recebe tráfego externo nas portas 80/443, termina
  # o TLS e encaminha para este container via rede Docker interna.
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.transferlog.entrypoints: websecure
      traefik.http.routers.transferlog.rule: Host(`${DOMAIN}`)
      traefik.http.routers.transferlog.tls.certresolver: mytlschallenge
      traefik.http.services.transferlog.loadbalancer.server.port: "80"
    depends_on:
      - backend

networks:
  proxy:
    external: true
    name: n8n_default

volumes:
  db-data:
  backend-uploads:
